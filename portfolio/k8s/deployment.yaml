apiVersion: apps/v1
kind: Deployment
metadata: {name: portfolio}
spec:
  replicas: 1
  selector: {matchLabels: {app: portfolio}}
  template:
    metadata: {labels: {app: portfolio}}
    spec:
      containers:
        - name: portfolio
          image: nbdevops3036/portfolio:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 80